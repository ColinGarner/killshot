[project]
name = "killshot"
version = "0.1.0"
description = "Lineup efficiency, win probability and killshots for college basketball, from ESPN play-by-play."
requires-python = ">=3.11"
dependencies = []  # the core library uses only the standard library

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["killshot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
