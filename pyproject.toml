[project]
name = "killshot"
version = "0.1.0"
description = "Lineup efficiency, win probability and killshots for college basketball, from CollegeBasketballData.com play-by-play."
requires-python = ">=3.11"
# The core library (stints, ratings, events) uses only the standard library.
dependencies = [
    "psycopg[binary]>=3.1",      # Postgres driver (killshot/db.py)
    "fastapi>=0.110",            # web API (killshot/api.py)
    "uvicorn[standard]>=0.27",   # the web server that runs the API
    "pywebpush>=2.0",            # push notifications (killshot/push.py): VAPID signing + payload encryption
]

[project.scripts]
killshot = "killshot.cli:main"   # `pip install -e .` puts a `killshot` command on your PATH

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]  # httpx: FastAPI's test client uses it

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["killshot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
